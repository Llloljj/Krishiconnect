                    try {
                        const { data } = await supabase.from('fields').select('*').limit(1);

                                humidity: `${data[0].humidity}%`,

                e.preventDefault();
                setStatus('broadcasting');
                try {
                    const { error } = await supabase
                        .from('requirements')
                        .insert([{ 
                            crop_type: newReq.crop, 
                            quantity_tons: parseFloat(newReq.tons) 
                        }]);

                        alert("AI Broadcast Sent! Scanning for Farmer matches...");
                        setNewReq({ ...newReq, tons: '' });

                    console.log("Offline mode: Simulation complete.");
